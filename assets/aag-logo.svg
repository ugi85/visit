<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="aag-grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32CD32"/>
      <stop offset="100%" stop-color="#0B6623"/>
    </linearGradient>
    <linearGradient id="aag-grad-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3399"/>
      <stop offset="100%" stop-color="#E6007E"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B6623"/>
      <stop offset="50%" stop-color="#32CD32"/>
      <stop offset="100%" stop-color="#E6007E"/>
    </linearGradient>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E6007E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Icon: Modern Geometric Mountain & Upward Arrow -->
  <g transform="translate(10, 10)">
    <!-- Mountain Background Shape -->
    <path d="M10 75 L38 28 L58 55 L74 32 L100 75 Z" fill="#E8F5E9" />
    <path d="M10 75 L38 28 L54 50 L42 75 Z" fill="url(#aag-grad-green)" opacity="0.85" />
    <path d="M50 75 L74 32 L98 75 Z" fill="#0B6623" />
    <path d="M74 32 L86 52 L98 75 Z" fill="#064415" />

    <!-- Dynamic Upward Chevron Arrow (Magenta & Lime) -->
    <path d="M26 84 L56 36 L86 84 L72 84 L56 58 L40 84 Z" fill="url(#arrow-grad)" filter="url(#glow-magenta)" />
    <!-- Secondary fast streak -->
    <polygon points="56,12 66,28 46,28" fill="#E6007E" />
  </g>

  <!-- Typography Brand Group -->
  <g transform="translate(120, 15)">
    <!-- "AAG" Sporty Bold Letters -->
    <text x="0" y="52" font-family="'Outfit', 'Montserrat', sans-serif" font-size="52" font-weight="900" font-style="italic" letter-spacing="-1">
      <tspan fill="#0B6623">A</tspan>
      <tspan fill="#0B6623">A</tspan>
      <tspan fill="#E6007E">G</tspan>
    </text>

    <!-- Company Name -->
    <text x="2" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1e293b">
      PT ANUGRAH AMARTHA GLOBAL
    </text>

    <!-- Tagline Ribbon Badge -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="265" height="18" rx="9" fill="url(#aag-grad-magenta)" />
      <!-- Small lime accent dot -->
      <circle cx="10" cy="9" r="3.5" fill="#32CD32" />
      <text x="20" y="12.5" font-family="'Outfit', sans-serif" font-size="9" font-weight="800" letter-spacing="1.2" fill="#FFFFFF">
        STEP UP TO THE NEXT LEVEL
      </text>
      <!-- Mini arrow -->
      <path d="M246 6 L253 9 L246 12 Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>
